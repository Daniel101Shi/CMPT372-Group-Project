services:
  postgres:
    image: postgres:16-alpine
    container_name: cmpt372-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backendAPI}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topsecretsecret}
      POSTGRES_DB: ${POSTGRES_DB:-lopo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backendAPI} -d ${POSTGRES_DB:-lopo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cmpt372-backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backendAPI}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topsecretsecret}
      POSTGRES_DB: ${POSTGRES_DB:-lopo_db}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env, see .env.example}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: cmpt372-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules

volumes:
  postgres_data:
